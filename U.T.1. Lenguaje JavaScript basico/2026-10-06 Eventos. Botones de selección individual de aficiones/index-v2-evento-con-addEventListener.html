<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Mi afición favorita</h1>

    <form action="https://www.paginaquenoexiste.com/aficiones.php">
        <section id="eSctAficiones">
            <input type="radio" name="aficion" id="eRadnm" value="nm" onchange="mostrarMensaje(event)">
            <label for="eRadnm">Navegar por el mar</label>
        </section>
        <button type="submit">Enviar</button>
    </form>
    <script>

        const aficiones = [
            { clave: 'cc', valor: 'Conducir coches'},
            { clave: 'em', valor: 'Escuchar música'},
            { clave: 'sm', valor: 'Salir con mujeres'},
            { clave: 'll', valor: 'Leer libros'},
            { clave: 'sa', valor: 'Salir con amigos'},
            { clave: 'jf', valor: 'Jugar al fútbol'},
            { clave: 'ai', valor: 'Aprender idiomas'},
        ]

        const nSctAficiones = document.getElementById('eSctAficiones')

        for(let aficion of aficiones){

            const nRadAficion = document.createElement('input')
            nSctAficiones.appendChild(nRadAficion)
            nRadAficion.setAttribute('type', 'radio')
            nRadAficion.setAttribute('name', 'aficion')
            nRadAficion.setAttribute('id', `eRad${aficion.clave}`)
            nRadAficion.setAttribute('value', aficion.clave)
            // nRadAficion.setAttribute('onchange', `mostrarMensaje('${aficion.clave}', this)`)

            nRadAficion.addEventListener('change', mostrarMensaje)
    
            const nLabAficion = document.createElement('label')
            nSctAficiones.appendChild(nLabAficion)
            nLabAficion.setAttribute('for', `eRad${aficion.clave}`)
            nLabAficion.textContent = aficion.valor
        }

        function mostrarMensaje(e){
            console.log(e.target, e.target.getAttribute('value'))
        }




    </script>
</body>
</html>
