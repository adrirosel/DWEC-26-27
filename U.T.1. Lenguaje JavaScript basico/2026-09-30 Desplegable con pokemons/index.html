<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module">
        import {pokemons} from './pokemons.js'

        const nSel = document.getElementById('eSel')

        for(let i in pokemons){
            const nOpt = document.createElement('option')
            nSel.appendChild(nOpt)
            nOpt.setAttribute('value', pokemons[i].url.split("/")[6])

            nOpt.textContent = `${pokemons[i].name}`
        }

    </script>
</head>
<body>
    <h1>Pokemons</h1>

    <select id="eSel">
        
    </select>
</body>
</html>
