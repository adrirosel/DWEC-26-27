<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: blue;
        }
    </style>
    <script>
        console.log("JavaScript o EcmaScript")
        console.log("La ultima version de JavaScript es ES2026")
        console.log("JavaScript moderno empezo con ES6 (2015)")
        console.log("El JavaScript anterior es ES5 (2009). Ya no hacia falta emplear librerias como JQuery.")
    </script>
</head>
<body>
    <h1>Introduccion a JavaScript</h1>

    <h2>Tipos de datos en EcmaScript</h2>

    <h3>JavaScript es un lenguaje de tipado dinamico</h3>
    <script>
        "use strict";

        let variable
        console.log(variable, typeof(variable))

        variable = 1
        console.log(variable, typeof(variable))

        variable = 1.1
        console.log(variable, typeof(variable))

        variable = "uno"
        console.log(variable, typeof(variable))

        variable = '1'
        console.log(variable, typeof(variable))

        variable = `uno`
        console.log(variable, typeof(variable))

        variable = true
        console.log(variable, typeof(variable))

        variable = null
        console.log(variable, typeof(variable))

        variable = undefined
        console.log(variable, typeof(variable))

        variable = {
            nombre : 'Adrian', 
            apellidos : 'Rosel Martinez'
        };
        console.log(variable, typeof(variable))

        variable = ['dwec', 'dwes']
        console.log(variable, typeof(variable))

        variable = [1, 1.1, true, "uno", undefined, null]
        console.log(variable, typeof(variable))

        function saludo(){
            console.log("Buenos dias")
        }
        console.log(variable, typeof(saludo))

    </script>
</body>
</html>
