<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Ordenada</title>
</head>
<body>
    <h1>Módulos de segundo curso</h1>

    <ol id="eOl"></ol>
    

    <script>
        
        const nOl = document.getElementById("eOl")
        nOl.setAttribute('type', 'I')
        const eLi = document.createElement('li')
        eLi.textContent = 'Desarrollo Web en Entorno Cliente'
        nOl.appendChild(eLi)

    
        const eLi2 = document.createElement('li')
        eLi2.textContent = 'Desarrollo Web Entorno Servidor'
        nOl.appendChild(eLi2)

        
        const eLi3 = document.createElement('li')
        eLi3.textContent = 'Despliegue de Aplicaciones Web'
        nOl.appendChild(eLi3)

    
        const eLi4 = document.createElement('li')
        eLi4.textContent = 'Diseño Interfaces Web'
        nOl.appendChild(eLi4)
        
    </script>
</body>
</html>
