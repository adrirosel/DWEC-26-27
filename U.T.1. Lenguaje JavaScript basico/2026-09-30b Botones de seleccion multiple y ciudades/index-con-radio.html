<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="module">
        import {ciudades} from './ciudades.js'
        const nSct = document.getElementById('eSct')

        for (let ciudad of ciudades) {

            const nInp = document.createElement('input')
            nSct.appendChild(nInp)

            nInp.setAttribute('type', 'radio')
            nInp.setAttribute('name', 'ciudad')
            nInp.setAttribute('id', `eChk${ciudad.codigoPostal}`)
            nInp.setAttribute('value', ciudad.codigoPostal)
            if(ciudad.codigoPostal === "30800"){
                nInp.setAttribute('checked', '')
            }


            const nLabl = document.createElement('label')
            nSct.appendChild(nLabl)
            nLabl.setAttribute('for', `eChk${ciudad.codigoPostal}`)
            nLabl.textContent = `${ciudad.nombre}`

            const nBr = document.createElement('br')
            nSct.appendChild(nBr)
        }


    </script>
</head>
<body>
    <h1>Ciudades de Murcia</h1>

    <form id="eSct" action="https://www.sdlkfjghl.com/ciudades.php" method="get">
        <!-- <input type="checkbox" name="lorca" id="eChkLorca">
        <label for="eChkLorca">Lorca</label>

        <input type="checkbox" name="aguilas" id="eChkaguilas">
        <label for="eChkaguilas">Águilas</label> -->
        <!-- <input type="submit" value="Enviar"> -->
        <button>Enviar</button> <!--Por defecto dentro de un formulario, el boton hace submit-->
        <br>
        
    </form>
</body>
</html>
